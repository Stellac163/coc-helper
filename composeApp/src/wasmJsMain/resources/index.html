<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COC 跑团助手</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f1115;
        }
        /* 全屏启动加载遮罩：Wasm 下载/编译、中文字体加载期间一直盖住画面，
           避免首帧空白或汉字先显示成空心方块（tofu）。 */
        #app-loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: #0f1115;
            transition: opacity 0.35s ease;
        }
        #app-loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top-color: #7c8cff;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #app-loading .hint {
            color: #9aa0aa;
            font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            letter-spacing: 0.08em;
        }
    </style>
</head>
<body>
    <div id="app-loading">
        <div class="spinner"></div>
        <div class="hint">正在加载…</div>
    </div>
    <script src="composeApp.js"></script>
</body>
</html>
